[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfdm"
version = "0.1.0"
description = "Functional Diffusion Maps of molecular transition-path ensembles, with water-permutation-invariant distances and surrogate/SHAP interpretation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shaheerah Shahid" }, { name = "Suman Chakrabarty" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-fda>=0.9",
    "MDAnalysis>=2.6",
    "joblib>=1.3",
    "shap>=0.44",
]

[project.optional-dependencies]
fast = ["numba>=0.58", "dtaidistance>=2.3"]
notebooks = ["jupyter", "nbformat", "SciencePlots"]

[tool.setuptools]
packages = ["pathfdm"]
